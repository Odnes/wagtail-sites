  <div class="navbar-brand">
    <a role="button" class="navbar-burger is-large" aria-label="menu" aria-expanded="false" data-target="nav-expanded">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </a>
  </div>

  <div id="nav-expanded" class="navbar-menu">
    <div class="navbar-start">
      {% for item in menu_items %}
        {% if item.has_dropdown %}
          <div class="navbar-item has-dropdown is-hoverable">
            <a class="navbar-link">
              {{ item.label }}
            </a>        
            <div class="navbar-dropdown">
              {% for submenu in item.submenus %}
                <a class="navbar-item" href="{{ submenu.value.url }}"> <!-- .is-selected for coloring -->
                         {{submenu.value.label}} 

                </a>
              {% endfor %}
            </div>
          </div>

        {% else %}
          <a class="navbar-item" href="{{ item.url }}">
            {{ item.label }}
          </a>
        {% endif %}
      {% endfor %}
    </div>
